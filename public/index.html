<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vacation Finder</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--fg:#14202e;--mut:#5d6b7a;--acc:#1668e3;--ok:#1a8f4c;--bad:#c0392b;--bd:#e1e6ed}
@media(prefers-color-scheme:dark){:root{--bg:#0f1620;--card:#18222f;--fg:#e8eef5;--mut:#93a1b1;--acc:#5b9bff;--ok:#4cc27e;--bad:#ff7a6b;--bd:#2a3748}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px}h1{margin:0 0 4px}p.sub{color:var(--mut);margin:0 0 16px}
textarea{width:100%;min-height:90px;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit}
button{margin-top:10px;padding:10px 20px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-top:14px}
.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.score{font-size:1.6rem;font-weight:700;color:var(--acc)}
.mut{color:var(--mut);font-size:.9rem}.ok{color:var(--ok)}.bad{color:var(--bad)}
.days{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.day{border:1px solid var(--bd);border-radius:8px;padding:4px 10px;font-size:.85rem}
.book{margin-top:10px}.btn{display:inline-block;padding:6px 14px;background:var(--acc);color:#fff;border-radius:8px;text-decoration:none;margin-right:6px}.book a{color:var(--acc)}.book a.btn{color:#fff}.alt{border-style:dashed}h2{margin:24px 0 0;font-size:1.1rem}.sum{white-space:pre-wrap}.note{font-size:.85rem;color:var(--mut);margin-top:12px}
</style></head><body><main>
<h1>✈️ Vacation Finder</h1>
<p class="sub">Describe your trip: dates, budget, group size and the weather or vibe you want.</p>
<textarea id="p">I'm going on vacation from 9 October to 12 October, 2 people, max €500 total, I want warm sunny weather and a relaxed beach/city vibe.</textarea>
<button id="go">Find trips</button>
<div id="out"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('go').onclick=async()=>{
  const b=$('go');b.disabled=true;$('out').innerHTML='<div class="card">Searching flights and weather…</div>';
  try{
    let key='';try{key=localStorage.getItem('vacationApiKey')||''}catch{}
    const h={'content-type':'application/json'};if(key)h['x-api-key']=key;
    let r=await fetch('/api/v1/search',{method:'POST',headers:h,body:JSON.stringify({prompt:$('p').value})});
    if(r.status===401){key=prompt('API key required:')||'';try{localStorage.setItem('vacationApiKey',key)}catch{}h['x-api-key']=key;r=await fetch('/api/v1/search',{method:'POST',headers:h,body:JSON.stringify({prompt:$('p').value})});}
    const d=await r.json();if(!r.ok)throw new Error(d.error.message);render(d);
  }catch(e){$('out').innerHTML='<div class="card bad">'+esc(e.message)+'</div>'}
  b.disabled=false;
};
function card(o,d){
  const c=d.query,m=d.meta;let h='';
  {
    const w={...o.weather,rainChance:o.weather.rainChancePct},f=o.flight,x=o.destination,tp=f.totalPrice;
    h+=`<div class="card${f.exactDates?"":" alt"}"><div class="row"><div><b>${esc(x.city)}, ${esc(x.country)}</b> <span class="mut">${esc(x.iata)} · ${x.distanceKm} km</span><div class="mut">${esc(x.why)}</div></div><div class="score">${o.score.total}</div></div>
    <div class="row" style="margin-top:8px"><div>✈️ <b>€${f.pricePerPerson}</b> pp · €${tp} total ${o.withinBudget===true?'<span class="ok">within budget</span>':o.withinBudget===false?'<span class="bad">over budget</span>':''}<div class="mut">${f.exactDates?'':'<span class="bad">price is for '+esc(f.departDate)+' → '+esc(f.returnDate)+'</span> · '}${f.stops ?? '?'} stop(s) · ${f.verified?'<span class="ok">✓ live price for '+c.travelers+' traveler(s)</span>':'cached price, not verified'}</div></div>
    <div>🌤 ${w.avgMinC?.toFixed(0)}–${w.avgMaxC?.toFixed(0)}°C${w.rainChance!=null?` · rain ${w.rainChance.toFixed(0)}%`:` · ${w.rainMm.toFixed(0)} mm`}${w.sunHoursPerDay!=null?` · ${w.sunHoursPerDay.toFixed(1)} h sun/day`:''}<div class="mut">${w.source==='forecast'?'forecast':'last year same dates'}</div></div></div>
    <div class="book"><a class="btn" href="${esc(o.links.booking)}" target="_blank" rel="noopener noreferrer">${o.links.bookingSource==='google-flights'?'View on Google Flights':'View this fare'} →</a> <a href="${esc(o.links.googleFlights)}" target="_blank" rel="noopener noreferrer">Google Flights</a> · <a href="${esc(o.links.skyscanner)}" target="_blank" rel="noopener noreferrer">Skyscanner</a><div class="mut">Opens the airline/agency search. Final price and availability are confirmed there.</div></div>
    <div class="days">${w.days.map(t=>`<span class="day">${t.date.slice(5)}: ${t.min?.toFixed(0)}/${t.max?.toFixed(0)}°C ${t.rain>0.5?'🌧'+t.rain.toFixed(0)+'mm':'☀️'}</span>`).join('')}</div></div>`;
  }
  return h;
}
function render(d){
  const c=d.query,m=d.meta,W=d.warnings;
  let h=`<div class="card"><b>${esc(c.origin)} → ${(m.requestedPlaces?.matched||[]).length?esc(m.requestedPlaces.matched.join(', ')):'anywhere'}</b> · ${esc(c.departDate)} to ${esc(c.returnDate)} · ${c.travelers} traveler(s)${c.budgetTotal?` · budget €${c.budgetTotal}`:''}`;
  if(d.summary)h+=`<p class="sum">${esc(d.summary)}</p>`;
  h+='</div>';
  if(!d.options.length){
    const L={no_price_data:'no fare data for these dates',flight_error:'flight API error',weather_error:'weather API error',over_budget:'over budget',unavailable:'not available for your group',verify_error:'live check failed',too_long:'flight too long',only_other_dates:'only on other dates'};
    h+='<div class="card"><b>No fares for your exact dates'+((d.alternatives||[]).length?' (see Additional dates below)':'')+'.</b> Why each destination was skipped:<ul>'+(m.diagnostics||[]).map(x=>`<li>${esc(x.city||x.iata)}: ${esc(L[x.status]||x.status)}${x.detail?' <span class="mut">('+esc(x.detail)+')</span>':''}</li>`).join('')+'</ul></div>';}
  h+=d.options.map(o=>card(o,d)).join('');
  if((d.alternatives||[]).length){
    h+='<h2>Additional dates</h2><p class="mut">Not the dates you asked for. Cheaper or available on nearby days. Check the dates on each card.</p>';
    h+=d.alternatives.map(o=>card(o,d)).join('');
  }
  const notes=[];
  if((m.requestedPlaces?.unresolved||[]).length)notes.push('Could not find an airport for: '+m.requestedPlaces.unresolved.join(', ')+'.');
  if(W.includes('demo_flight_prices'))notes.push('Flight prices are DEMO estimates. Add TRAVELPAYOUTS_TOKEN (and SERPAPI_KEY) in .env for real ones.');
  if(W.includes('flight_prices_cached_unverified'))notes.push('Prices come from a cache of recent searches and may be outdated. Add SERPAPI_KEY to check availability live.');
  if(m.droppedUnavailable)notes.push(m.droppedUnavailable+' option(s) removed: no flights available for '+c.travelers+' traveler(s).');
  if(m.droppedOverBudget)notes.push(m.droppedOverBudget+' option(s) removed: over budget.');
  if(W.includes('ai_disabled_basic_parser'))notes.push('No AI key set (DEEPSEEK_API_KEY or ANTHROPIC_API_KEY): using a basic parser and a fixed destination list.');
  if(notes.length)h+=`<div class="note">${notes.map(esc).join('<br>')}</div>`;
  $('out').innerHTML=h;
}
</script></main></body></html>
